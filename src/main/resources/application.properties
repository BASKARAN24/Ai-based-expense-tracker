spring.application.name=ai-expense-tracker

# ---------- Server ----------
server.port=8080

# ---------- Database ----------
# Default profile: embedded H2, file-backed, so the app runs with zero setup.
# Data persists in ./data/expense_tracker.mv.db between restarts.
# To use real MySQL instead, run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (see application-mysql.properties) and set DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:h2:file:./data/expense_tracker;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA / Hibernate ----------
# 'update' is convenient for local dev; use schema.sql + validate/none in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Override with an environment variable in real deployments
app.jwt.secret=${JWT_SECRET:c2VjdXJlLXNhbXBsZS1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Groq (AI budget prediction + investment research agent) ----------
# Get a free key at https://console.groq.com
app.groq.api-key=${GROQ_API_KEY:}
app.groq.api-url=https://api.groq.com/openai/v1/chat/completions
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
