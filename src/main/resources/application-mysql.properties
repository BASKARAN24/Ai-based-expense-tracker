# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (or set SPRING_PROFILES_ACTIVE=mysql as an environment variable)

spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
